name: Land Claude branches

on:
  # Every time a cloud session pushes its branch
  push:
    branches: ['claude/**']
  # When a review PR is closed (merged or not)
  pull_request:
    types: [closed]
    branches: [main]

# If a session pushes several times in a row, only the latest push is processed.
# Each branch gets its own group, so parallel sessions don't interfere.
concurrency:
  group: land-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  AUTHOR_NAME: Santiago Bartolini
  AUTHOR_EMAIL: 4937254+santiagobartolini@users.noreply.github.com

jobs:
  land:
    # Skip events triggered by branch deletions
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-latest
    env:
      # Use your own token if the LANDING_TOKEN secret exists;
      # otherwise fall back to the built-in Actions token.
      GH_TOKEN: ${{ secrets.LANDING_TOKEN || github.token }}
      SRC: ${{ github.ref_name }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.LANDING_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

      - name: Rewrite authorship and clean commit messages
        run: |
          # git rebase --exec does not accept multi-line commands,
          # so the rewrite logic lives in its own script.
          cat > /tmp/clean-commit.sh <<'SCRIPT'
          #!/usr/bin/env bash
          msg=$(git log -1 --format=%B \
            | grep -v -i -E "(^Co-Authored-By: Claude|Generated with \[?Claude Code|claude\.ai/code/session_|^Claude-Session:)" \
            || true)
          if [ -z "$(printf '%s' "$msg" | tr -d '[:space:]')" ]; then
            msg=$(git log -1 --format=%s)
          fi
          printf '%s\n' "$msg" | git commit --amend --reset-author -F -
          SCRIPT
          chmod +x /tmp/clean-commit.sh

          DEST="review/${SRC#claude/}"
          git checkout -B "$DEST" "origin/$SRC"

          # Replay every commit on top of main, strip Claude attribution
          # lines from the message, and re-author it with your identity.
          # --force-rebase ensures every commit is replayed even when
          # the branch is already up to date with main.
          git rebase --force-rebase origin/main --exec /tmp/clean-commit.sh

          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          echo "AHEAD=$AHEAD" >> "$GITHUB_ENV"

          if [ "$AHEAD" -gt 0 ]; then
            git push --force origin "$DEST"
          else
            # Everything on this branch is already in main (stale session): clean it up.
            git push origin --delete "$SRC" || true
          fi

      - name: Open PR if it does not exist
        if: env.AHEAD != '0'
        run: |
          gh pr view "$DEST" >/dev/null 2>&1 || \
            gh pr create --base main --head "$DEST" \
              --title "$(git log -1 --format=%s)" \
              --body "Changes from session \`$SRC\`, with rewritten authorship."

      - name: Report conflict
        if: failure()
        run: |
          echo "::error::Could not land $SRC on top of main (likely a conflict). The branch was left untouched."

  cleanup:
    # Runs when a PR coming from a review/... branch is closed
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LANDING_TOKEN || github.token }}
      HEAD: ${{ github.head_ref }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete session branches
        run: |
          gh api -X DELETE "repos/$REPO/git/refs/heads/claude/${HEAD#review/}" || true
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD" || true
