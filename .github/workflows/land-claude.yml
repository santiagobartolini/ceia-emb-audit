name: Land Claude branches

on:
  # Cada vez que una sesión cloud pushea su rama
  push:
    branches: ['claude/**']
  # Cuando cerrás (mergeado o no) un PR de review
  pull_request:
    types: [closed]
    branches: [main]

# Si una sesión pushea varias veces seguidas, procesa solo la última.
# Cada rama tiene su propio grupo: sesiones en paralelo no se pisan.
concurrency:
  group: land-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  AUTHOR_NAME: Santiago Bartolini
  AUTHOR_EMAIL: 4937254+santiagobartolini@users.noreply.github.com

jobs:
  land:
    # No corre cuando el evento es el borrado de una rama
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-latest
    env:
      # Usa tu token propio si cargaste el secret LANDING_TOKEN;
      # si no, el token automático de Actions.
      GH_TOKEN: ${{ secrets.LANDING_TOKEN || github.token }}
      SRC: ${{ github.ref_name }}
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LANDING_TOKEN || github.token }}

      - name: Configurar identidad
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

      - name: Reescribir autoría y limpiar mensajes
        run: |
          DEST="review/${SRC#claude/}"
          git checkout -B "$DEST" "origin/$SRC"

          # Reaplica cada commit sobre main, le quita las líneas de
          # atribución a Claude y lo reescribe a tu nombre.
          # --force-rebase garantiza que se procesen todos los commits
          # aunque la rama ya esté al día con main.
          git rebase --force-rebase origin/main --exec '
            git log -1 --format=%B \
              | grep -v -i -E "(^Co-Authored-By: Claude|Generated with \[?Claude Code|claude\.ai/code/session_|^Claude-Session:)" \
              | git commit --amend --reset-author -F -
          '

          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          echo "AHEAD=$AHEAD" >> "$GITHUB_ENV"

          if [ "$AHEAD" -gt 0 ]; then
            git push --force origin "$DEST"
          else
            # Todo lo de esta rama ya está en main (sesión vieja): se limpia.
            git push origin --delete "$SRC" || true
          fi

      - name: Abrir PR si no existe
        if: env.AHEAD != '0'
        run: |
          gh pr view "$DEST" >/dev/null 2>&1 || \
            gh pr create --base main --head "$DEST" \
              --title "$(git log -1 --format=%s)" \
              --body "Cambios de la sesión \`$SRC\`, con autoría reescrita."

      - name: Avisar si hubo conflicto
        if: failure()
        run: |
          echo "::error::No se pudo integrar $SRC sobre main (probable conflicto). La rama quedó intacta."

  cleanup:
    # Corre al cerrar un PR que venga de una rama review/...
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LANDING_TOKEN || github.token }}
      HEAD: ${{ github.head_ref }}
      REPO: ${{ github.repository }}
    steps:
      - name: Borrar las ramas de la sesión
        run: |
          gh api -X DELETE "repos/$REPO/git/refs/heads/claude/${HEAD#review/}" || true
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD" || true
